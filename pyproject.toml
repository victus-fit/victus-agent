[project]
name = "victus-agent"
version = "0.1.0"
description = "Victus agent runtime with safety prechecks and typed tool registration."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langgraph-cli[inmem]>=0.4,<1",
  "httpx>=0.28,<1",
  "litellm>=1,<2",
  "mcp>=1,<2",
  "psycopg[binary]>=3,<4",
  "pydantic>=2",
  "PyJWT[crypto]>=2,<3",
  "PyYAML>=6",
  "SQLAlchemy>=2,<3",
  "starlette>=0.50,<1",
  "uvicorn>=0.38,<1",
]

[project.scripts]
victus = "adapters.cli:main"
victus-mcp = "adapters.mcp.server:main"
victus-mcp-http = "adapters.mcp.transport:main"
victus-chat-http = "adapters.http.app:main"

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3",
]
phoenix = [
  "arize-phoenix-client>=2,<3",
  "arize-phoenix-otel>=0.16,<1",
  "openinference-instrumentation-langchain>=0.1,<1",
]
safety-index = [
  "chromadb>=1,<2",
  "datasets>=4,<5",
  "huggingface-hub>=1,<2",
  "numpy>=2,<3",
  "tqdm>=4,<5",
]
safety-training = [
  "scikit-learn>=1.7,<2",
]
test = [
  "pytest>=8",
]
safety-local = [
  "accelerate>=1",
  "torch>=2",
  "transformers>=5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/adapters",
    "src/bootstrap",
    "src/demo",
    "src/domain",
  "src/tools",
  "src/victus_platform",
  "ops",
]
