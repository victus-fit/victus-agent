x-agent-service: &agent-service
  image: victus-agent:local
  build:
    context: .
  environment: &agent-environment
    APP_ENV: ${APP_ENV:-local}
    DATABASE_URL: postgresql+psycopg://victus:postgres@postgres:5432/victus_agent
    BACKEND_API_URL: ${VICTUS_DOCKER_BACKEND_API_URL:-http://host.docker.internal:8000/v1}
    LITELLM_PROXY_API_BASE: ${VICTUS_DOCKER_LITELLM_PROXY_API_BASE:-}
    LITELLM_PROXY_API_KEY: ${LITELLM_PROXY_API_KEY:-}
    LITELLM_KEY: ${LITELLM_KEY:-}
    LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
    LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-victus-langgraph-local}
    PHOENIX_BASE_URL: http://phoenix:6006
    PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
    PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-victus-local}
    PHOENIX_TRACING_ENABLED: ${PHOENIX_TRACING_ENABLED:-false}
    OPENINFERENCE_HIDE_INPUTS: ${OPENINFERENCE_HIDE_INPUTS:-false}
    OPENINFERENCE_HIDE_OUTPUTS: ${OPENINFERENCE_HIDE_OUTPUTS:-false}
    OPENINFERENCE_HIDE_INPUT_MESSAGES: ${OPENINFERENCE_HIDE_INPUT_MESSAGES:-false}
    OPENINFERENCE_HIDE_OUTPUT_MESSAGES: ${OPENINFERENCE_HIDE_OUTPUT_MESSAGES:-false}
    VICTUS_CHAT_DEBUG_ENABLED: ${VICTUS_CHAT_DEBUG_ENABLED:-false}
    VICTUS_API_TOKEN: ${VICTUS_API_TOKEN:-}
    VICTUS_RAG_API_URL: ${VICTUS_DOCKER_RAG_API_URL:-http://host.docker.internal:8080}
    VICTUS_RAG_API_TOKEN: ${VICTUS_RAG_API_TOKEN:-}
    VICTUS_RAG_API_TIMEOUT_SECONDS: ${VICTUS_RAG_API_TIMEOUT_SECONDS:-10}
    VICTUS_DEMO_JWT_JWKS_JSON: ${VICTUS_DEMO_JWT_JWKS_JSON:-}
    VICTUS_DEMO_SESSION_TTL_SECONDS: ${VICTUS_DEMO_SESSION_TTL_SECONDS:-900}
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  phoenix:
    image: arizephoenix/phoenix:version-19.0.0
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "${PHOENIX_PORT:-6007}:6006"
    volumes:
      - victus_phoenix_data:/mnt/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:6006/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: victus
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: victus_agent
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - victus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U victus -d victus_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    <<: *agent-service
    command: ["uv", "run", "--no-sync", "python", "-m", "adapters.http.app"]
    environment:
      <<: *agent-environment
      VICTUS_CHAT_HTTP_HOST: 0.0.0.0
      VICTUS_CHAT_HTTP_PORT: 8766
    ports:
      - "${VICTUS_CHAT_HTTP_PORT:-8766}:8766"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8766/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  mcp:
    <<: *agent-service
    command: ["uv", "run", "--no-sync", "python", "-m", "adapters.mcp.transport"]
    environment:
      <<: *agent-environment
      VICTUS_MCP_HTTP_HOST: 0.0.0.0
      VICTUS_MCP_HTTP_PORT: 8765
    ports:
      - "${VICTUS_MCP_HTTP_PORT:-8765}:8765"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8765/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  victus_phoenix_data:
  victus_postgres_data:
